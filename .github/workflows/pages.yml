name: Docs (GitHub Pages)

# The published docs describe releases, not every commit: they build on a
# minor or major release tag (v0.3.0, v1.0.0) and never on a patch release
# (v0.3.1) or a pre-release (v0.4.0-rc.1). Run it by hand to publish between
# releases. The github-pages environment must allow `v*` tags to deploy.
# The gate is CI's: the build requires CI to have passed on the commit and
# then builds only rustdoc and the book (`./scripts/check.sh docs`).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # read CI's verdict on the published commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
      MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"
      RUSTFLAGS: ""
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08-31
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --silent --show-error \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output mdbook.tar.gz
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum --check --strict
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Require CI to have passed on this commit
        # The full gate already runs in CI on this exact commit (on the push
        # to main and again on the release tag); running it here a second
        # time proved nothing new. Wait for a push-event run of ci.yml on
        # this commit and require its verdict; a pull_request run tests a
        # merge with its base, not the commit, so it does not count.
        # Re-running a failed CI run and then this workflow picks up the new
        # result.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 120); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion)"')"
            if grep -q ' completed success$' <<<"$runs"; then
              echo "CI passed on $GITHUB_SHA:"; echo "$runs"; exit 0
            fi
            if [ -n "$runs" ] && ! grep -qv ' completed ' <<<"$runs"; then
              echo "::error::CI did not pass on $GITHUB_SHA; re-run it, then re-run this workflow"
              echo "$runs"; exit 1
            fi
            echo "waiting for CI on $GITHUB_SHA: ${runs:-no run yet}"
            sleep 30
          done
          echo "::error::no finished CI run on $GITHUB_SHA after 60 minutes"; exit 1
      - name: Build rustdoc and the book
        run: ./scripts/check.sh docs
      - name: Add API reference
        run: |
          mkdir -p docs/book/api
          cp -r target/doc/. docs/book/api/
      # What actions/upload-pages-artifact does, inlined: that composite action
      # calls actions/upload-artifact by tag, which the repository's
      # full-SHA pinning policy refuses even when the outer action is pinned.
      - name: Archive site
        run: |
          tar --dereference --hard-dereference --directory docs/book \
            -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
