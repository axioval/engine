[workspace]
resolver = "2"
# Crates are grouped by role, not by the dependency they happen to wrap:
#   contracts/  source-neutral vocabulary, depends on nothing in this tree
#   engine/     capability execution over those contracts
#   sources/    adapters that feed the engine, one directory per port kind
#   facade/     batteries-included re-export surface
#   apps/       executables
# A new geometry backend (CGAL, manifold3d) is a sibling under
# sources/geometry/ and needs no change anywhere else.
members = [
    "crates/contracts/*",
    "crates/engine/*",
    "crates/sources/*/*",
    "crates/facade/*",
    "crates/apps/*",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
readme = "README.md"
authors = ["Axioval contributors"]
repository = "https://github.com/axioval/engine"
keywords = ["bim", "validation", "rules", "geometry", "ifc"]
categories = ["development-tools", "parser-implementations"]

[workspace.dependencies]
axioval-spec = { path = "crates/contracts/spec", version = "0.2.0" }
axioval-ir = { path = "crates/contracts/ir", version = "0.2.0" }
axioval-engine = { path = "crates/engine/core", version = "0.2.0" }
axioval-rules = { path = "crates/engine/rules", version = "0.2.0" }
axioval-ifc = { path = "crates/sources/semantic/ifc", version = "0.2.0" }
axioval-axiolid = { path = "crates/sources/geometry/axiolid", version = "0.2.0" }
axioval-icdd = { path = "crates/sources/assembly/icdd", version = "0.2.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
indexmap = { version = "2.11.0", features = ["serde"] }
smallvec = { version = "1.15.1", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v5"] }
tracing = "0.1.41"
clap = { version = "4.5.46", features = ["derive"] }
axiolid-core = "0.3.0"
axiolid-mesh = "0.3.0"
axiolid-measure = "0.3.0"
axiolid-overlay = "0.3.0"
ifc-model = "0.2.2"
ifc-properties = "0.2.1"
ifc-schema = "0.2.2"
ifc-step = "0.2.1"
regex = "1.11.2"
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
