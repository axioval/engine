[workspace]
resolver = "2"
# Crates are grouped by role, not by the dependency they happen to wrap:
#   contracts/  source-neutral vocabulary, depends on nothing in this tree
#   engine/     capability execution over those contracts
#   sources/    adapters that feed the engine, one directory per port kind
#   sinks/      writers that turn a finished report into an exchange format
#   packages/   importers that write rule packages from other rule formats
#   codecs/     standalone wire-format codecs with no engine or source types
#   facade/     batteries-included re-export surface
#   hosts/      libraries composing several adapters for hosts
#   apps/       executables
# A new geometry backend (CGAL, manifold3d) is a sibling under
# sources/geometry/ and needs no change anywhere else.
members = [
    "crates/contracts/*",
    "crates/engine/*",
    "crates/sources/*/*",
    "crates/sinks/*",
    "crates/packages/*",
    "crates/codecs/*",
    "crates/facade/*",
    "crates/hosts/*",
    "crates/apps/*",
]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
readme = "README.md"
authors = ["Axioval contributors"]
repository = "https://github.com/axioval/engine"
keywords = ["bim", "validation", "rules", "geometry", "ifc"]
categories = ["development-tools", "parser-implementations"]

[workspace.dependencies]
axioval-ir = { path = "crates/contracts/ir", version = "0.6.1" }
axioval-engine = { path = "crates/engine/core", version = "0.6.1" }
axioval-rules = { path = "crates/engine/rules", version = "0.6.1" }
axioval-ifc = { path = "crates/sources/semantic/ifc", version = "0.6.1" }
axioval-axiolid = { path = "crates/sources/geometry/axiolid", version = "0.6.1" }
axioval-icdd = { path = "crates/sources/assembly/icdd", version = "0.6.1" }
axioval-bcf = { path = "crates/sinks/bcf", version = "0.6.1" }
axioval-bcf-api = { path = "crates/sinks/bcf-api", version = "0.6.1" }
axioval-bcf-snapshot = { path = "crates/sinks/bcf-snapshot", version = "0.6.1" }
axioval-xlsx = { path = "crates/sinks/xlsx", version = "0.6.1" }
axioval-html = { path = "crates/sinks/html", version = "0.6.1" }
axioval-ids = { path = "crates/packages/ids", version = "0.6.1" }
axioval-export = { path = "crates/packages/export", version = "0.6.1" }
axioval-mcs = { path = "crates/packages/mcs", version = "0.6.1" }
axioval-java-stream = { path = "crates/codecs/java-stream", version = "0.6.1" }
axioval-host-ifc-axiolid = { path = "crates/hosts/ifc-axiolid", version = "0.6.1" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
indexmap = { version = "2.11.0", features = ["serde"] }
# A fast keyed hasher for the run's memo of measurements (already in the
# tree through hashbrown).
foldhash = "0.2.0"
smallvec = { version = "1.15.1", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v5"] }
# JSON Schemas of the package contract, behind `axioval-ir`'s `schema`
# feature; `std` and `derive` only.
schemars = { version = "1.2.2", default-features = false, features = ["std", "derive"] }
# Test-only: validates package fixtures against those schemas. No remote or
# file resolution: every schema is in memory.
jsonschema = { version = "0.58.5", default-features = false }
# Test-only: generated inputs for the parity harness. `std` only: no fork,
# timeout or failure-persistence files.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
# Bench-only: a counting global allocator, for the template benchmark's peak
# heap. No dependencies of its own.
peak_alloc = "0.3.0"
tracing = "0.1.41"
clap = { version = "4.5.46", features = ["derive"] }
axiolid-brep = "0.3.3"
# 0.3.13 mitres a swept disk's sharp corners again (axiolid/kernel#245);
# 0.3.14 lowers I sections of decimal (IPE, HEA) sizes at no tolerance (#250);
# 0.3.15 refuses pinched rings unless asked to accept them (#253, #262);
# 0.3.16 reads a `-0.0` corner as `0.0` when ordering a ring (#269), accepts
# keyhole rings on surface paths (#270) and builds exact extrusions down or
# oblique to the profile normal (#275); 0.3.17 builds exact oblique
# extrusions of arc profiles and oblique circles with exact tilted
# elliptical-cylinder walls and refuses oblique ellipses by name (#280).
axiolid-construct = "0.3.18"
axiolid-core = "0.3.0"
axiolid-inspect = "0.3.6"
axiolid-mesh = "0.3.0"
# 0.3.10 stops the exact boundary distance early on a shown touch or
# crossing (axiolid/kernel#273).
axiolid-measure = "0.3.10"
# 0.3.5 to 0.3.9 regressed coverage through an opening and cut cost regions
# with a sliver along a turned wall (axiolid/kernel#219, #222); 0.3.10 fixes
# both; 0.3.11 decides ring orientation and `ZeroArea` exactly relative to
# a vertex, so small rings far from the origin keep their winding (#274);
# 0.3.12 keeps Minkowski sum and erosion memory linear in the subdivision's
# pieces, with bit-identical results (#292); 0.3.13 decides exact edge
# contact and accepts its own settled output fed back (#272); 0.3.15
# unions and intersects overlapping slender soups about ten times faster,
# with byte-identical output (#315).
axiolid-overlay = "0.3.15"
axiolid-ray-mesh = "0.4.0"
axiolid-route = "0.3.7"
axiolid-spatial = "0.3.0"
# 0.3.3 states memory budgets per worker (axiolid/kernel#226); the engine sets
# no budget.
axiolid-contracts = "0.3.3"
# 0.3.3 and model 0.3.4 carry the exact alignment relations (CUBIC
# transitions, vertical arcs and clothoids, cant) `ifc-geometry` 0.8 lowers to;
# 0.3.6 adds curve paths (#289, #290), additively.
axiolid-curve = "0.3.9"
# The CLI derives IFC4X3 linear placements with its reference evaluator
# (`ReferenceCurveEvaluator`, through `ifc-geometry` 0.10, engine#224); 0.3.10
# inverts points on an elliptical cylinder (axiolid/kernel#287) and reads
# curve paths (#290); projecting onto one is still refused. 0.3.11 certifies
# piece lengths and seam-snapping windows (#294).
axiolid-evaluate = "0.3.16"
# 0.3.9 subtracts placed extrusions exactly (axiolid/kernel#228, through
# axiolid-brep-boolean 0.1.2) and reports a certified deviation per mesh
# (#232, with axiolid-reference 0.3.4); 0.3.10 clips by half-spaces (#234),
# reports what its booleans decided within tolerance (#236, through
# axiolid-brep-boolean 0.1.3) and certifies curved booleans (#235); 0.3.12
# reports each body's rounding floor (#244, through axiolid-brep-boolean
# 0.1.4) and mitres sharp swept-disk corners with a proven bound (#245);
# 0.3.13 builds round holes touching a planar face or an I-beam's root
# fillets (#243, #249, through axiolid-brep-boolean 0.1.5, which also keeps
# a report at no tolerance empty, #251), triangulates warped authored
# polygon faces with their warp (#254) and resolves composite and trimmed
# boundaries of curve-bounded planes (#255); 0.3.14 reports a warped face's
# slab width as certified (#257, #261), triangulates planar and B-rep faces
# with the certified clipper (#260) and sweeps along elevated directrices
# (#252); 0.3.15 welds shared edges through inserted corners and reports a
# Solid label whose mesh does not close as `MeshClosure::OpenSolid` (#265);
# 0.3.16 refuses a mesh extrusion along its profile plane (#281), snaps away
# a difference's skin thinner than tolerance and reports it under
# `deviation::SNAPPED_OPERANDS` (#276, through axiolid-brep-boolean 0.1.6),
# keeps planar face corners through the sliver split (#278) and bounds
# half-spaces by profile contours with arcs (#277); 0.3.17 sews booleans
# cut by a cylinder, sphere, cone or torus wall of a mirrored (downward)
# construction (#288, through axiolid-brep-boolean 0.1.7); 0.3.18 narrows
# that snap to rounding residues and falls back to the unsnapped operands
# when a snapped boolean is refused or pinches (#291, through
# axiolid-brep-boolean 0.1.8), so skins of 1 µm to 1 mm stay geometry;
# 0.3.19 cuts tilted elliptical-cylinder walls exactly (#287, through
# axiolid-brep-boolean 0.1.9), so a slab less an oblique round opening is
# exact and its mesh certified; 0.3.20 snaps oriented stations onto a seam
# within their window (#294); 0.3.21 keeps a stretched instance's deviation
# bound within the requested budget (#258). Its axiolid-triangulate 0.3.3
# updates adjacency locally per flip (#268), with identical output; 0.3.22
# brings axiolid-triangulate 0.3.4, which covers the exact convex hull
# (#299) and merges coincident input points (#300), in a different but
# deterministic triangle order. 0.3.23 is the release `ifc-geometry` 0.24
# builds on. 0.3.24 certifies runs of sections at stations along bases with
# certified frame laws (#247), sweeps disks round closed polylines and
# beside arcs (#248), and bounds booleans of authored-mesh and flat-faced
# B-rep operands against their exact boolean (#266). 0.3.25 snaps boolean
# operands within the rounding of the coordinates the result is placed at
# (#312) and certifies lengths of varying offsets along ellipses and
# B-splines (#307); booleans outgrowing their declared operand bound are
# refused by memory budget (#308), which the engine does not set. 0.3.26
# includes the f64 placement rounding in placed bounds and refuses a budget
# below it by name (#295), bounds all-planar booleans at rounding scale
# (#314), and compiles curved faces without p-curves (#310).
axiolid-mesh-compile = "0.3.26"
axiolid-exact-compile-contract = "0.3.1"
# 0.3.3 adds `MeshClosure::OpenSolid` (#265).
axiolid-mesh-compile-contract = "0.3.4"
# 0.3.4 declares its scratch as a true upper bound on a thread pool (#226).
axiolid-mesh-boolean-boolmesh = "0.3.6"
# 0.3.5 adds oriented stations (#246), additively; `ifc-geometry` 0.9
# requires it for the IFC4X3 stations it lowers.
axiolid-model = "0.3.13"
axiolid-primitive = "0.3.0"
axiolid-profile = "0.3.0"
axiolid-surface = "0.3.0"
openbim-bcf = "0.6.0"
# `audit-schema` is the document audit against the IFC schemas (AGPL
# `ifc-schema`). Never `audit`: it embeds the CC BY-ND template catalog.
openbim-ids = { version = "0.2.2", features = ["audit-schema"] }
# Door and window operation geometry (openbimrs/ifc#148, #170) is published
# only in the IFC facade, which joins `ifc-geometry` and `ifc-properties`; `geometry-select`
# compiles no geometry kernel.
# 0.24 re-exports `ifc-geometry` 0.18; its `authoring` feature stays off.
openbim_ifc = { package = "openbim-ifc", version = "0.34.0", default-features = false, features = ["geometry-select", "properties", "ifc2x3", "ifc4", "ifc4x3"] }
ifc-classification = "0.4.0"
# The CLI reads each `IfcAlignment`'s centreline, stationing and cant to
# locate products along it (engine#252). 0.7 evaluates Viennese bends for
# the section's cant and refuses those it does not determine (#312, #364);
# `ifc-geometry` 0.13 requires it. 0.7.1 gives a station on a seam the
# incoming tangent, mitres sectioned runs across seams and snaps stations
# within `ARC_LENGTH_TOLERANCE` to the seam (0.7.2 for ifc-geometry 0.18).
# 0.8 lowers a Viennese bend that rotates about a held rail to the banked
# curve (#364), for ifc-geometry 0.19 (0.8.1 for ifc-geometry 0.20). 0.9
# is the release ifc-geometry 0.26 requires; its writers refuse malformed
# GlobalIds.
ifc-alignment = "0.9.0"
# 0.9 lowers IFC4X3 stations, offset curves by distances and sectioned
# solids and surfaces (openbimrs/ifc#307) and, since 0.8.2, refuses an
# `IfcParameterValue` along an alignment by name (openbimrs/ifc#347). 0.10
# can take Reference View openings as applied (#351) and derive a linear
# placement through a caller's curve evaluator (#353, #354), in the IFC4.3
# (tangent, left, up) frame (#355). 0.11 resolves grid placements and
# placements relative to grid or linear ones (#362, #363); 0.12 reads
# `IfcIndexedPolyCurve` profile boundaries and refuses open ones (#335);
# 0.13 subtracts openings in their host's frame under one world `Instance`
# (#388), so flush openings in georeferenced hosts mesh; 0.14 lowers
# polygonal half-space boundaries given as straight-edged `IfcCompositeCurve`
# or `IfcIndexedPolyCurve` like their `IfcPolyline` twin (#393); 0.15 lowers
# a collinear `IfcArcIndex` as straight segments (#396); 0.16 lowers
# stations on a tangent discontinuity with the incoming tangent and runs of
# sections and offsets across one, refused by name before (#346); 0.17
# lowers polygonal half-space boundaries with circular-arc segments
# (`IfcCompositeCurve` of trimmed circles, `IfcIndexedPolyCurve` with an
# `IfcArcIndex`) exactly as a contour of lines and arcs (#398); 0.18 lowers
# stations on composite, trimmed and station-placed bases, a joint reading
# its incoming segment (#346), and curve segments placed linearly (#311);
# 0.19 derives a linear placement on a seam with the incoming tangent and
# verifies its cached position against that frame (#409); 0.20 derives a
# linear placement on a composite, trimmed or offset basis through the
# evaluator's curve paths (#418) and lowers stations on offset bases beside
# lines, polylines and in-plane circles (#414). 0.21 adds the opt-in
# Axiolid wire format (#367), which the engine leaves off; 0.22 lowers single
# stations on offsets of gradient, spiral, B-spline and elliptical bases
# through Axiolid's seam window (#423). 0.23 lowers sectioned runs along such
# bases with seam windows, mitred at their joints (#429), and derives linear
# placements on them through open-ended path pieces (#427); runs by distances
# along them stay refused (#433). 0.24 lowers offsets by distances along them
# as curves, continued to the basis ends the kernel measures (#433), and
# derives linear placements on ellipses and B-splines trimmed at interior
# parameters, by points or by arc length, through bounded path pieces (#436).
# 0.25 lowers stations on such offsets by distances with seam windows and
# refuses an offset of an offset by name (#443); 0.25.1 resolves stations
# on B-splines trimmed by points in the kernel (#439); 0.26.1 lowers
# stations on bases offset at stations (#443). 0.27 compiles curved
# advanced B-rep faces bounded by edge curves alone (#454, through kernel#310)
# and meshes a body mixing curves with solids, its curves left to the curve
# call (#458). 0.27.1 refuses a polygonal bounded half space whose prism is
# oblique to its plane instead of meshing the body uncut, and no longer
# mirrors the footprint of one bounded normal against Z (#515). 0.27.2
# compiles an oblique clip with a convex polyline boundary as a chain of
# half spaces; its exact bound waits on the kernel, so such a body is still
# left unmeasured (#518).
ifc-geometry = { version = "0.27.2", default-features = false, features = ["ifc2x3", "ifc4", "ifc4x3"] }
# Map conversions only: without the default `transform` feature it links no
# geometry crate (never Axiolid). 0.7 resolves IFC2X3's
# ePSet_MapConversion and ePSet_ProjectedCRS (openbimrs/ifc#451), where
# IFC2X3 was refused.
ifc-georef = { version = "0.7.0", default-features = false, features = ["ifc2x3", "ifc4", "ifc4x3"] }
ifc-material = "0.5.0"
ifc-spatial = "0.5.1"
ifc-model = "0.3.1"
ifc-properties = "0.8.1"
ifc-schema = "0.3.2"
ifc-step = "0.5.0"
# ifcXML: the codec's own layout and the buildingSMART XSD configuration,
# both read schema-strict.
ifc-xml = "0.4.1"
# `xml.rs` bounds an ifcXML document's start tags and reads its root with it;
# `axioval-engine` reads xlsx rule parameter tables with it.
quick-xml = "0.42"
ifc-style = "0.5.0"
ifc-systems = "0.5.0"
regex = "1.11.2"
sha2 = "0.11.0"
# ifcZIP archives; deflate is the only compression method they use.
zip = { version = "8.6", default-features = false }
# Raw deflate members of `.mcs` archives, read by `axioval-mcs` through the
# zlib-rs backend `zip` already builds.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
# The NFC check MCS applies to every archive member name.
unicode-normalization = "0.1.25"
# Full Unicode default case folding, as Python's `str.casefold()`, for the
# member-name collisions MCS refuses.
caseless = "0.2.2"
# Holds `ifc-properties`' `PropertyIndex`, which borrows the model, beside
# the `Arc<Model>` it borrows (the IFC adapter's property service).
yoke = { version = "0.8.3", default-features = false, features = ["alloc", "derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Line tables are enough for a backtrace's file and line, and keep test
# binaries small and fast to link; dependencies carry no debug info.
# Dependencies are optimized: the geometry tests spend nearly all their time
# in the axiolid kernels and their hashing and overlay dependencies, which
# run five to ten times faster at opt-level 2. Debug assertions and overflow
# checks stay on, and the workspace's own crates stay unoptimized.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

