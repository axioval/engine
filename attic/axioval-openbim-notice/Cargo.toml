[package]
name = "axioval-openbim"
version = "0.2.0"
description = "Deprecated: renamed to axioval-ifc. This crate is a notice only and contains no functionality."
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
readme = "README.md"
authors = ["Axioval contributors"]
repository = "https://github.com/axioval/engine"
keywords = ["deprecated", "ifc", "openbim", "bim"]
categories = ["science"]

# Deliberately its own workspace root. Without this table Cargo walks up,
# finds the engine workspace, and refuses every command here with
# "believes it's in a workspace when it's not" -- which broke the exact
# republish procedure this crate documents. Excluding it from the engine
# workspace is not enough; the retired crate must root its own.
[workspace]

# No dependencies on purpose: a deprecation notice must not drag the real
# stack in, and must keep building long after the code it replaced moved on.
[dependencies]
