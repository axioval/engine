[package]
name = "axioval-cli"
description = "Command-line runner for normalized Axioval packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "axioval"
path = "src/main.rs"
doc = false

[dependencies]
# The CLI is the host that composes a source adapter with a report sink.
axioval = { path = "../../facade/axioval", version = "0.3.0", features = ["ifc", "bcf", "bcf-api", "bcf-snapshot", "axiolid"] }
# `--geometry`: the CLI meshes IFC bodies itself and hands the meshes to the
# Axiolid services. Neither adapter may depend on the other, so this bridge
# lives in the host.
axiolid-contracts.workspace = true
axiolid-core.workspace = true
axiolid-curve.workspace = true
axiolid-mesh.workspace = true
# Required at 0.3.4 for curve-bounded planes (space-boundary surfaces);
# ifc-geometry's reference backend is this compiler.
axiolid-mesh-compile.workspace = true
axiolid-mesh-compile-contract.workspace = true
axiolid-model.workspace = true
axiolid-primitive.workspace = true
axiolid-profile.workspace = true
axiolid-surface.workspace = true
ifc-geometry = { workspace = true, features = ["compile-reference-backend"] }
ifc-model.workspace = true
ifc-spatial.workspace = true
ifc-step.workspace = true
# `check --ids` and `ids translate`: IDS documents read and translated
# into rule packages in memory.
axioval-ids.workspace = true
openbim-ids.workspace = true
# `export --profile`: the profiles every export target implements.
axioval-export.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
openbim-bcf.workspace = true
zip = { workspace = true, features = ["deflate"] }

[features]
default = []
# HTTPS for `axioval bcf push` and `pull`, through the platform's TLS
# library (OpenSSL on Linux).
tls = ["axioval/bcf-api-tls"]

[lints]
workspace = true
