[package]
name = "axioval-cli"
description = "Command-line runner for normalized Axioval packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "axioval"
path = "src/main.rs"
doc = false

[dependencies]
# The CLI is the host that composes a source adapter with a report sink.
axioval = { path = "../../facade/axioval", version = "0.2.0", features = ["ifc", "bcf"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
openbim-bcf.workspace = true

[lints]
workspace = true
