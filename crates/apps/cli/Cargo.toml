[package]
name = "axioval-cli"
description = "Command-line runner for normalized Axioval packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "axioval"
path = "src/main.rs"
doc = false

[dependencies]
# The CLI is the host that composes a source adapter with a report sink.
# `--geometry` meshes IFC bodies and registers them with the Axiolid services
# through the host layer's bridge (`ifc-geometry`), as any host does.
axioval = { path = "../../facade/axioval", version = "0.6.1", features = ["ifc", "ifc-geometry", "bcf", "bcf-api", "bcf-snapshot", "axiolid", "xlsx", "html"] }
# `check --ids` and `ids translate`: IDS documents read and translated
# into rule packages in memory.
axioval-ids.workspace = true
openbim-ids.workspace = true
# `.mcs` package archives wherever a ruleset or definitions are read.
axioval-mcs.workspace = true
# `export --profile`: the profiles every export target implements.
axioval-export.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Write the ifcXML form of a test model with IFC4's attribute names.
ifc-schema.workspace = true
# Parse test models exactly as written, without the adapter's tolerance.
ifc-step.workspace = true
# `tests/check.rs` derives a linear placement by hand to compare with the
# bridge's, and writes ifcXML through `ifc-model`'s codec.
axiolid-evaluate.workspace = true
ifc-geometry.workspace = true
ifc-model.workspace = true
ifc-xml.workspace = true
openbim-bcf.workspace = true
sha2.workspace = true
zip = { workspace = true, features = ["deflate"] }
# `benches/templates.rs`: each capability rebuilt as a template against the
# implementation it replaced, its peak heap counted by a global allocator.
axioval-rules = { workspace = true, features = ["parity-reference"] }
peak_alloc.workspace = true

[[bench]]
name = "templates"
harness = false

[features]
default = []
# HTTPS for `axioval bcf push` and `pull`, through the platform's TLS
# library (OpenSSL on Linux).
tls = ["axioval/bcf-api-tls"]

[lints]
workspace = true
