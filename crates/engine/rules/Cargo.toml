[package]
name = "axioval-rules"
description = "Reusable trusted rule capability implementations for Axioval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
axioval-engine.workspace = true
axioval-ir.workspace = true
regex.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
# The template runner's few named values per object, kept inline.
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# The rules crate's own tests hold each template to the implementation it
# replaced, kept behind `parity-reference`.
axioval-rules = { path = ".", features = ["parity-reference"] }

[features]
# The implementations of capabilities since rebuilt as templates, as
# parity references for tests only (`axioval_rules::reference`).
parity-reference = []

[lints]
workspace = true
