[package]
name = "axioval"
description = "Batteries-included facade for the Axioval validation engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
axioval-engine.workspace = true
axioval-ir.workspace = true
axioval-rules.workspace = true
axioval-ifc = { workspace = true, optional = true }
axioval-axiolid = { workspace = true, optional = true }
axioval-icdd = { workspace = true, optional = true }
axioval-bcf = { workspace = true, optional = true }
axioval-bcf-api = { workspace = true, optional = true }
axioval-bcf-snapshot = { workspace = true, optional = true }
axioval-xlsx = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
openbim-bcf.workspace = true
axiolid-construct.workspace = true
axiolid-core.workspace = true
axiolid-mesh.workspace = true
axiolid-overlay.workspace = true

# One feature per source adapter, named for the format or library it adapts.
# A future geometry backend adds `cgal = ["dep:axioval-cgal"]` beside `axiolid`
# without disturbing any existing consumer.
[features]
default = []
ifc = ["dep:axioval-ifc"]
axiolid = ["dep:axioval-axiolid"]
icdd = ["dep:axioval-icdd"]
# Output sinks follow the same rule: one feature per exchange format.
bcf = ["dep:axioval-bcf"]
# Exchange with BCF API 3.0 servers; `bcf-api-tls` adds HTTPS through the
# platform's TLS library.
bcf-api = ["bcf", "dep:axioval-bcf-api"]
bcf-api-tls = ["bcf-api", "axioval-bcf-api/native-tls"]
# Illustrative snapshot images of BCF viewpoints, rendered from meshes.
bcf-snapshot = ["bcf", "dep:axioval-bcf-snapshot"]
# Spreadsheet workbooks of findings and report tables.
xlsx = ["dep:axioval-xlsx"]

[lints]
workspace = true
