[package]
name = "axioval-host-ifc-axiolid"
description = "Host composition of the Axioval IFC and Axiolid adapters: IFC bodies meshed and registered as geometry services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true

# The host layer is the one place both adapters meet: neither may depend on
# the other, so meshing IFC bodies and handing them to the Axiolid services
# is host composition (`scripts/architecture.py`, `HOST_CRATES`).
[dependencies]
axioval-engine.workspace = true
axioval-ir.workspace = true
axioval-rules.workspace = true
axioval-ifc.workspace = true
axioval-axiolid.workspace = true
axiolid-contracts.workspace = true
# The rings a profile flattens to and their certified deviation, which
# bound an unmeasured extrusion of it (#358).
axiolid-construct.workspace = true
axiolid-core.workspace = true
axiolid-curve.workspace = true
axiolid-mesh.workspace = true
# The certified Hausdorff distance between two tessellated bodies, which
# confirms a derived copy (#390).
axiolid-measure.workspace = true
# ifc-geometry's reference backend is this compiler (with the boolmesh
# boolean); 0.3.10 reports each mesh's certified deviation, booleans included
# (`compile_mesh_with_deviation`, axiolid/kernel#232), which the bridge
# declares.
axiolid-mesh-boolean-boolmesh.workspace = true
axiolid-mesh-compile.workspace = true
axiolid-mesh-compile-contract.workspace = true
axiolid-model.workspace = true
axiolid-primitive.workspace = true
axiolid-profile.workspace = true
axiolid-surface.workspace = true
ifc-geometry = { workspace = true, features = ["compile-reference-backend"] }
# Derives each `IfcLinearPlacement` from its basis curve, as
# `LoweringSession::with_curve_evaluator` asks of the caller (engine#224).
axiolid-evaluate.workspace = true
# Each `IfcAlignment`'s centreline, station equations and cant, which the
# alignment service locates products along (engine#252).
ifc-alignment.workspace = true
ifc-model.workspace = true
ifc-spatial.workspace = true

[lints]
workspace = true
