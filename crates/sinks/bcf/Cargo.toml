[package]
name = "axioval-bcf"
description = "BCF issue archives from Axioval validation reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true

# An output sink reads the report contract only: never the engine, never a
# source adapter. The GlobalId scheme it shares with the IFC adapter is pinned
# by the facade's `ifc_bcf` test, not by a dev-dependency here: a dev-dependency
# on an unpublished sibling breaks workspace package verification.
[dependencies]
axioval-ir.workspace = true
openbim-bcf.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[lints]
workspace = true
