[package]
name = "axioval-axiolid"
description = "Independent Axiolid geometry evidence adapter for any Axioval source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
axioval-engine.workspace = true
axioval-ir.workspace = true
axiolid-brep.workspace = true
# Exact boundaries of rigidly placed extrusions, revolutions and swept
# disks (`exact_boundary`); `axiolid-mesh-compile` reads a swept disk's
# directrix exactly as it compiles the disk, and its exact compiler builds
# differences of placed extrusions (openings).
axiolid-construct.workspace = true
axiolid-contracts.workspace = true
axiolid-core.workspace = true
axiolid-curve.workspace = true
axiolid-exact-compile-contract.workspace = true
axiolid-mesh-compile.workspace = true
axiolid-inspect.workspace = true
axiolid-mesh.workspace = true
axiolid-measure = { workspace = true, features = ["exact"] }
axiolid-model.workspace = true
axiolid-overlay.workspace = true
axiolid-profile.workspace = true
axiolid-ray-mesh.workspace = true
axiolid-route.workspace = true
axiolid-spatial.workspace = true
thiserror.workspace = true

[dev-dependencies]
axiolid-core.workspace = true
axiolid-mesh.workspace = true
# Tests compare exact boundaries with the meshes the kernel compiles from
# the same graphs.
axiolid-mesh-boolean-boolmesh.workspace = true
axiolid-mesh-compile-contract.workspace = true

[lints]
workspace = true
