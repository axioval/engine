[package]
name = "axioval-ifc"
description = "IFC semantic source adapter for Axioval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
axioval-engine.workspace = true
axioval-ir.workspace = true
ifc-classification.workspace = true
# Placement chains only: the workspace entry disables every feature, so no
# geometry kernel is pulled in.
ifc-geometry.workspace = true
# Map conversions (`coordinates.rs`); the workspace entry disables the
# `transform` feature, so no Axiolid crate is linked.
ifc-georef.workspace = true
ifc-material.workspace = true
ifc-model.workspace = true
ifc-properties.workspace = true
ifc-schema.workspace = true
ifc-step.workspace = true
# ifcXML: type conformance proves an XML read is the model the file states.
ifc-xml.workspace = true
quick-xml.workspace = true
ifc-style.workspace = true
ifc-systems.workspace = true
# Door leaves only (`door_operation`); no codec and no geometry kernel.
openbim_ifc.workspace = true
sha2.workspace = true
thiserror.workspace = true
# ifcZIP: reads the one model member of an archive.
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true
