# cargo-deny policy for all workspace crates and features.
# Keep exceptions narrow, versioned, and justified inline.

[graph]
all-features = true

[advisories]
# ifc-schema@0.1.0 uses bincode 2.0.1 solely to decode bundled, build-produced
# schema artifacts. RUSTSEC-2025-0141 reports project discontinuation, not a
# vulnerability, and states that no safe upgrade exists.
ignore = ["RUSTSEC-2025-0141"]

[licenses]
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  # Weak, file-level copyleft. MPL-2.0 section 3.3 permits distributing a larger
  # work under a Secondary License (GPL/AGPL family), so an AGPL-3.0-or-later
  # distribution may include MPL-2.0 files provided those files stay under MPL.
  # None of the MPL dependencies here carry the "Incompatible With Secondary
  # Licenses" notice that would remove that permission. Used by the Axiolid
  # geometry kernel.
  "MPL-2.0",
  "Unicode-3.0",
  # Public-domain dedication with a permissive fallback licence; it imposes no
  # conditions an AGPL-3.0-or-later distribution could conflict with. Reached
  # through tiny-keccak <- const-random <- ahash, which both Axiolid 0.3 and
  # the IFC 0.2 crates pull in.
  "CC0-1.0",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = [
  { crate = "syn@2.0.119", reason = "tracing-attributes has not yet converged on syn 3" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
