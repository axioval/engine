# Standalone: NOT a member of the engine workspace. It cannot be published while
# `openbim-bcf`'s writer is unreleased, because Cargo refuses path dependencies
# in a published crate. See staging/AGENTS.md for the rewiring steps.
[workspace]

[package]
name = "axioval-bcf"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Staging: BCF issue archives from Axioval reports"
publish = false

[dependencies]
# The only engine contract this sink reads: reports and object aliases.
axioval-ir = { path = "../../crates/contracts/ir" }
# UNPUBLISHED writer: path dependency until the release carrying
# `openbim_bcf::write` lands on crates.io (openbimrs/bcf#1).
openbim-bcf = { path = "../../../../openbim/packages/bcf/openbim-bcf" }
thiserror = "2.0.16"
uuid = { version = "1.18.1", features = ["v5"] }

[dev-dependencies]
axioval-ifc = { path = "../../crates/sources/semantic/ifc" }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
